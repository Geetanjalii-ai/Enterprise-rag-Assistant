services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enterprise-rag-backend:latest
    container_name: enterprise-rag-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    image: enterprise-rag-frontend:latest
    container_name: enterprise-rag-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

volumes:
  backend_uploads:
    name: enterprise_rag_backend_uploads

networks:
  app-network:
    name: enterprise_rag_network
    driver: bridge
